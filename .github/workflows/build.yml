name: Build Module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: jetbrains
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - uses: extractions/setup-just@v4

      - uses: android-actions/setup-android@v4.0.1

      - name: Set up Android and Rust
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android

      - name: Build module
        run: just package

      - name: Verify module ZIP
        run: |
          unzip -t build/friston3-module.zip
          for entry in module.prop bin/audioserver-patch bin/friston3.sh; do
            unzip -Z1 build/friston3-module.zip | grep -Fx "$entry"
          done

      - name: Upload module ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          path: build/friston3-module.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
